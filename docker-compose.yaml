  open-webui:
    image: ghcr.io/jiaanliux/open-webui:dev
    container_name: open-webui  
    volumes:  
      - open-webui:/app/backend/data  
    # depends_on:  
    #   - ollama  
    ports:  
      - ${OPEN_WEBUI_PORT-4000}:8080  
    environment:  
      - 'OLLAMA_BASE_URL=${OLLAMA_BASE_URL}'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}'  
      - 'WEBUI_NAME=${WEBUI_NAME}'
      # --- Microsoft OAuth ---
      - 'MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}'
      - 'MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}'
      - 'MICROSOFT_CLIENT_TENANT_ID=${MICROSOFT_CLIENT_TENANT_ID}'
      - 'MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI}'
      - 'OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL}'
      - 'WEBUI_AUTH_SIGNOUT_REDIRECT_URL=${WEBUI_AUTH_SIGNOUT_REDIRECT_URL}'
      - 'ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP}'
      - 'ENABLE_PASSWORD_AUTH=${ENABLE_PASSWORD_AUTH}'
      - 'ENABLE_SIGNUP=${ENABLE_SIGNUP}'
      - 'DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE}'
      - 'WEBUI_URL=${WEBUI_URL}'
    extra_hosts:  
      - host.docker.internal:host-gateway  
    networks:
      - docker_shared_network
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}

networks:
  docker_shared_network:
    external: true
